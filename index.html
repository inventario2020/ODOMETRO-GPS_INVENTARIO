<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Odómetro GPS</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --panel2: #1e1e1e;
    --accent: #00e676;
    --accent-dim: #00c264;
    --warn: #ff5252;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 14px 14px 30px; }

  h1 { font-size: 18px; text-align: center; margin: 6px 0 14px; letter-spacing: 1px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }

  .status {
    text-align: center; font-size: 12px; padding: 6px 10px; border-radius: 8px;
    margin-bottom: 12px; background: var(--panel); color: var(--text-dim); border: 1px solid var(--border);
  }
  .status.ok { color: var(--accent); border-color: var(--accent-dim); }
  .status.err { color: var(--warn); border-color: var(--warn); }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }

  .speed-card { text-align: center; padding: 22px 16px; }
  .speed-value { font-size: 64px; font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .speed-unit { font-size: 16px; color: var(--text-dim); margin-top: 4px; letter-spacing: 2px; }
  .accuracy-tag { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .accuracy-tag.bad { color: var(--warn); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 15px; }

  .utm-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .utm-row:last-child { border-bottom: none; }
  .utm-label { color: var(--text-dim); font-size: 13px; }
  .utm-value { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }

  button {
    font-family: inherit; border: none; border-radius: 12px; padding: 16px;
    font-size: 16px; font-weight: 700; width: 100%; cursor: pointer;
    -webkit-appearance: none; letter-spacing: 0.5px;
  }
  .btn-primary { background: var(--accent); color: #002d15; }
  .btn-primary:active { background: var(--accent-dim); }
  .btn-secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:active { background: #262626; }
  .btn-danger { background: var(--warn); color: #2d0000; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button { flex: 1; }

  input[type="number"] {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    font-size: 18px; padding: 14px; border-radius: 10px; font-variant-numeric: tabular-nums;
    margin-bottom: 10px; text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }

  .progress-wrap { background: var(--panel2); border-radius: 10px; height: 14px; overflow: hidden; margin: 10px 0; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  .remaining-value { text-align: center; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 8px 0; }
  .remaining-value.done { color: var(--accent); }

  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin: 4px 0 10px; }

  .badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--panel2); color: var(--text-dim); margin-left: 6px; }
  .badge.live { background: rgba(0,230,118,0.15); color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>Odómetro GPS</h1>
  <div id="status" class="status">Esperando señal GPS…</div>
  <button class="btn-secondary" id="wakeLockBtn" style="margin-bottom:12px;">🔆 Mantener pantalla encendida: OFF</button>

  <div class="card speed-card">
    <div class="section-title" style="text-align:center;">Distancia total recorrida</div>
    <div class="value" id="totalDistance" style="font-size:64px; font-weight:800; color:#40c4ff; text-align:center;">0 m</div>
    <div class="btn-row">
      <button class="btn-secondary" id="resetTotalBtn">Reiniciar total</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Coordenadas UTM</div>
    <div class="utm-row"><span class="utm-label">Zona</span><span class="utm-value" id="utmZone">--</span></div>
    <div class="utm-row"><span class="utm-label">Easting (X)</span><span class="utm-value" id="utmEasting">--</span></div>
    <div class="utm-row"><span class="utm-label">Northing (Y)</span><span class="utm-value" id="utmNorthing">--</span></div>
    <div class="utm-row"><span class="utm-label">Lat / Lon</span><span class="utm-value" id="latLon" style="font-size:12px;">--</span></div>
  </div>

  <div class="card" style="text-align:center;">
    <div class="label" style="text-align:center;">Velocidad</div>
    <div class="speed-value" id="speedValue" style="font-size:44px;">0.0</div>
    <div class="speed-unit">KM/H</div>
    <div class="accuracy-tag" id="accuracyTag">precisión: --</div>
  </div>

  <div class="card">
    <div class="section-title">Distancia restante <span class="badge" id="countdownBadge">inactivo</span></div>
    <div id="setupBlock">
      <input type="number" id="initialMeters" placeholder="Metros a recorrer" inputmode="numeric">
      <button class="btn-primary" id="startCountdownBtn">Iniciar cuenta atrás</button>
    </div>
    <div id="activeBlock" style="display:none;">
      <div class="remaining-value" id="remainingValue">0 m</div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div style="text-align:center; font-size:12px; color:var(--text-dim); margin-bottom:6px;">
        Distancia desde el punto de inicio: <span id="walkedSinceStart">0 m</span>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="pauseCountdownBtn">Pausar</button>
        <button class="btn-danger" id="stopCountdownBtn">Detener</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Estado global ----------
  let lastPos = null;          // última posición válida {lat, lon, t, speed}
  let totalDistanceM = 0;      // distancia total acumulada (Haversine tramo a tramo)
  let watchId = null;

  // Countdown ("Distancia restante"): mide la distancia en línea recta
  // desde el punto donde pulsaste "Iniciar" hasta tu posición actual.
  // Si avanzas, el restante baja; si retrocedes, el restante SUBE otra vez
  // (refleja tu posición real respecto al punto de partida, no los pasos dados).
  let countdown = {
    active: false,
    paused: false,
    initialMeters: 0,
    startLat: null,
    startLon: null
  };

  const MAX_PLAUSIBLE_SPEED_MS = 60; // ~216 km/h, filtro de saltos absurdos
  const MIN_ACCURACY_FOR_DISTANCE = 30; // metros; por encima de esto no sumamos a la distancia

  let wakeLock = null;
  const STORAGE_KEY = "odometro_gps_trayecto_v1";
  let saveTimer = null;

  // ---------- Vibración ----------
  function vibrate(pattern) {
    if ("vibrate" in navigator) {
      try { navigator.vibrate(pattern); } catch (e) { /* no soportado */ }
    }
  }

  // ---------- Wake Lock (pantalla encendida) ----------
  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      alert("Tu navegador no soporta Wake Lock API. Prueba con Chrome en Android.");
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", function () {
        updateWakeLockBtn(false);
      });
      updateWakeLockBtn(true);
    } catch (err) {
      alert("No se pudo mantener la pantalla encendida: " + err.message);
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
    updateWakeLockBtn(false);
  }

  function updateWakeLockBtn(active) {
    const btn = document.getElementById("wakeLockBtn");
    btn.textContent = active
      ? "🔆 Mantener pantalla encendida: ON"
      : "🔆 Mantener pantalla encendida: OFF";
    btn.style.color = active ? "#00e676" : "";
  }

  // Si la pestaña vuelve a estar visible y el wake lock estaba activo, hay que repedirlo
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && wakeLock === null &&
        document.getElementById("wakeLockBtn").textContent.includes("ON")) {
      requestWakeLock();
    }
  });

  // ---------- Persistencia en localStorage ----------
  function saveTrip() {
    try {
      const data = {
        totalDistanceM: totalDistanceM,
        countdown: countdown.active ? {
          active: true,
          paused: countdown.paused,
          initialMeters: countdown.initialMeters,
          startLat: countdown.startLat,
          startLon: countdown.startLon
        } : { active: false },
        savedAt: Date.now()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* almacenamiento no disponible o lleno */ }
  }

  function scheduleSave() {
    // Evita escrituras excesivas en cada lectura GPS: guarda como máximo cada 3s
    if (saveTimer) return;
    saveTimer = setTimeout(function () {
      saveTrip();
      saveTimer = null;
    }, 3000);
  }

  function loadTrip() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data) return;

      totalDistanceM = data.totalDistanceM || 0;
      el.totalDistance.textContent = formatMeters(totalDistanceM);

      if (data.countdown && data.countdown.active) {
        countdown.active = true;
        countdown.paused = data.countdown.paused;
        countdown.initialMeters = data.countdown.initialMeters;
        countdown.startLat = data.countdown.startLat;
        countdown.startLon = data.countdown.startLon;

        el.setupBlock.style.display = "none";
        el.activeBlock.style.display = "block";
        el.countdownBadge.textContent = countdown.paused ? "en pausa" : "en directo";
        el.countdownBadge.classList.toggle("live", !countdown.paused);
        el.pauseCountdownBtn.textContent = countdown.paused ? "Reanudar" : "Pausar";
      }
    } catch (e) { /* datos corruptos o no disponibles */ }
  }

  function clearSavedTrip() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  // ---------- Utilidades ----------
  function toRad(deg) { return deg * Math.PI / 180; }

  function haversineMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function formatMeters(m) {
    if (m >= 1000) return (m / 1000).toFixed(2) + " km";
    return Math.round(m) + " m";
  }

  // ---------- Conversión a UTM (WGS84) ----------
  function latLonToUTM(lat, lon) {
    const a = 6378137.0;
    const f = 1 / 298.257223563;
    const k0 = 0.9996;
    const e = Math.sqrt(f * (2 - f));
    const e2 = e * e;
    const ep2 = e2 / (1 - e2);

    let zoneNumber = Math.floor((lon + 180) / 6) + 1;
    // Excepciones: Noruega y Svalbard
    if (lat >= 56.0 && lat < 64.0 && lon >= 3.0 && lon < 12.0) zoneNumber = 32;
    if (lat >= 72.0 && lat < 84.0) {
      if (lon >= 0.0 && lon < 9.0) zoneNumber = 31;
      else if (lon >= 9.0 && lon < 21.0) zoneNumber = 33;
      else if (lon >= 21.0 && lon < 33.0) zoneNumber = 35;
      else if (lon >= 33.0 && lon < 42.0) zoneNumber = 37;
    }

    const lonOrigin = toRad((zoneNumber - 1) * 6 - 180 + 3);
    const latRad = toRad(lat);
    const lonRad = toRad(lon);

    const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
    const T = Math.tan(latRad) ** 2;
    const C = ep2 * Math.cos(latRad) ** 2;
    const A = Math.cos(latRad) * (lonRad - lonOrigin);

    const M = a * (
      (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256) * latRad -
      (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * latRad) +
      (15 * e2 * e2 / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * latRad) -
      (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * latRad)
    );

    let easting = k0 * N * (
      A + (1 - T + C) * Math.pow(A, 3) / 6 +
      (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120
    ) + 500000.0;

    let northing = k0 * (
      M + N * Math.tan(latRad) * (
        A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 +
        (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720
      )
    );

    if (lat < 0) northing += 10000000.0;

    const hemisphere = lat >= 0 ? "N" : "S";
    return {
      zone: zoneNumber + hemisphere,
      easting: easting,
      northing: northing
    };
  }

  // ---------- Elementos DOM ----------
  const el = {
    status: document.getElementById("status"),
    speedValue: document.getElementById("speedValue"),
    accuracyTag: document.getElementById("accuracyTag"),
    utmZone: document.getElementById("utmZone"),
    utmEasting: document.getElementById("utmEasting"),
    utmNorthing: document.getElementById("utmNorthing"),
    latLon: document.getElementById("latLon"),
    totalDistance: document.getElementById("totalDistance"),
    resetTotalBtn: document.getElementById("resetTotalBtn"),
    setupBlock: document.getElementById("setupBlock"),
    activeBlock: document.getElementById("activeBlock"),
    initialMeters: document.getElementById("initialMeters"),
    startCountdownBtn: document.getElementById("startCountdownBtn"),
    remainingValue: document.getElementById("remainingValue"),
    progressBar: document.getElementById("progressBar"),
    walkedSinceStart: document.getElementById("walkedSinceStart"),
    pauseCountdownBtn: document.getElementById("pauseCountdownBtn"),
    stopCountdownBtn: document.getElementById("stopCountdownBtn"),
    countdownBadge: document.getElementById("countdownBadge")
  };

  function setStatus(msg, type) {
    el.status.textContent = msg;
    el.status.className = "status" + (type ? " " + type : "");
  }

  // ---------- Render de posición ----------
  function renderPosition(pos) {
    const { latitude, longitude, speed, accuracy } = pos.coords;

    // UTM
    const utm = latLonToUTM(latitude, longitude);
    el.utmZone.textContent = utm.zone;
    el.utmEasting.textContent = Math.round(utm.easting) + " m";
    el.utmNorthing.textContent = Math.round(utm.northing) + " m";
    el.latLon.textContent = latitude.toFixed(6) + ", " + longitude.toFixed(6);

    // Precisión
    if (accuracy != null) {
      el.accuracyTag.textContent = "precisión: ±" + Math.round(accuracy) + " m";
      el.accuracyTag.className = "accuracy-tag" + (accuracy > MIN_ACCURACY_FOR_DISTANCE ? " bad" : "");
    }

    // Velocidad: usa GPS si está disponible y es plausible, si no calcula por Haversine/tiempo
    let speedKmh = null;
    const now = pos.timestamp || Date.now();

    if (speed != null && !isNaN(speed) && speed >= 0) {
      speedKmh = speed * 3.6;
    } else if (lastPos) {
      const dt = (now - lastPos.t) / 1000;
      if (dt > 0) {
        const d = haversineMeters(lastPos.lat, lastPos.lon, latitude, longitude);
        const v = d / dt;
        if (v <= MAX_PLAUSIBLE_SPEED_MS) speedKmh = v * 3.6;
      }
    }
    if (speedKmh == null) speedKmh = 0;
    // Filtro de ruido en parado
    if (speedKmh < 1.0) speedKmh = 0;
    el.speedValue.textContent = speedKmh.toFixed(1);

    // Distancia recorrida en este tramo (solo si la precisión es razonable
    // y el salto es plausible, para descartar rebotes de señal)
    if (lastPos && (accuracy == null || accuracy <= MIN_ACCURACY_FOR_DISTANCE)) {
      const dt = (now - lastPos.t) / 1000;
      const d = haversineMeters(lastPos.lat, lastPos.lon, latitude, longitude);
      const impliedSpeed = dt > 0 ? d / dt : 0;
      if (impliedSpeed <= MAX_PLAUSIBLE_SPEED_MS && d < 500) {
        // Distancia total: siempre suma, sin importar la dirección
        totalDistanceM += d;
      }
    }
    el.totalDistance.textContent = formatMeters(totalDistanceM);

    // Distancia restante: línea recta desde el punto de inicio del contador.
    // Si retrocedes, esta distancia baja y el restante vuelve a subir.
    if (countdown.active && !countdown.paused && countdown.startLat != null) {
      const walked = haversineMeters(countdown.startLat, countdown.startLon, latitude, longitude);
      const remaining = countdown.initialMeters - walked;
      updateCountdownUI(walked, remaining);
    }

    lastPos = { lat: latitude, lon: longitude, t: now };
    setStatus("Señal GPS activa", "ok");
    scheduleSave();
  }

  function updateCountdownUI(walked, remaining) {
    const clampedRemaining = Math.max(0, remaining);
    el.walkedSinceStart.textContent = formatMeters(walked);
    el.remainingValue.textContent = formatMeters(clampedRemaining);
    const pct = countdown.initialMeters > 0
      ? Math.min(100, (walked / countdown.initialMeters) * 100)
      : 0;
    el.progressBar.style.width = pct + "%";

    if (remaining <= 0) {
      const yaEstabaCompletado = el.remainingValue.classList.contains("done");
      el.remainingValue.classList.add("done");
      el.remainingValue.textContent = "¡Llegaste! 0 m";
      el.countdownBadge.textContent = "completado";
      el.countdownBadge.classList.remove("live");
      if (!yaEstabaCompletado) {
        vibrate([300, 100, 300, 100, 500]);
      }
    }
  }

  // ---------- Geolocalización ----------
  function startWatch() {
    if (!("geolocation" in navigator)) {
      setStatus("Este navegador no soporta geolocalización", "err");
      return;
    }
    watchId = navigator.geolocation.watchPosition(
      renderPosition,
      function (err) {
        let msg = "Error de GPS";
        if (err.code === err.PERMISSION_DENIED) msg = "Permiso de ubicación denegado";
        else if (err.code === err.POSITION_UNAVAILABLE) msg = "Ubicación no disponible";
        else if (err.code === err.TIMEOUT) msg = "Tiempo de espera agotado buscando señal";
        setStatus(msg, "err");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
  }

  // ---------- Botones ----------
  el.resetTotalBtn.addEventListener("click", function () {
    totalDistanceM = 0;
    el.totalDistance.textContent = "0 m";
    saveTrip();
  });

  document.getElementById("wakeLockBtn").addEventListener("click", function () {
    if (wakeLock) {
      releaseWakeLock();
    } else {
      requestWakeLock();
    }
  });

  el.startCountdownBtn.addEventListener("click", function () {
    const meters = parseFloat(el.initialMeters.value);
    if (!meters || meters <= 0) {
      alert("Introduce una distancia válida en metros");
      return;
    }
    if (!lastPos) {
      alert("Esperando señal GPS para fijar el punto de inicio. Inténtalo de nuevo en unos segundos.");
      return;
    }
    countdown.active = true;
    countdown.paused = false;
    countdown.initialMeters = meters;
    countdown.startLat = lastPos.lat;
    countdown.startLon = lastPos.lon;

    el.setupBlock.style.display = "none";
    el.activeBlock.style.display = "block";
    el.remainingValue.classList.remove("done");
    el.countdownBadge.textContent = "en directo";
    el.countdownBadge.classList.add("live");
    updateCountdownUI(0, meters);
    saveTrip();
  });

  el.pauseCountdownBtn.addEventListener("click", function () {
    countdown.paused = !countdown.paused;
    el.pauseCountdownBtn.textContent = countdown.paused ? "Reanudar" : "Pausar";
    el.countdownBadge.textContent = countdown.paused ? "en pausa" : "en directo";
    el.countdownBadge.classList.toggle("live", !countdown.paused);
    saveTrip();
  });

  el.stopCountdownBtn.addEventListener("click", function () {
    countdown.active = false;
    countdown.paused = false;
    countdown.startLat = null;
    countdown.startLon = null;
    el.initialMeters.value = "";
    el.pauseCountdownBtn.textContent = "Pausar";
    el.setupBlock.style.display = "block";
    el.activeBlock.style.display = "none";
    el.countdownBadge.textContent = "inactivo";
    el.countdownBadge.classList.remove("live");
    el.remainingValue.classList.remove("done");
    saveTrip();
  });

  // ---------- Arranque ----------
  loadTrip();
  startWatch();
})();
</script>
</body>
</html>
